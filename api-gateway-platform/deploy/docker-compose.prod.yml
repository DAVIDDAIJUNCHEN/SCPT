# ============================================================
# AlloMax 商业网关 · 生产部署模板（VPS：16C/64G，无域名，IP:端口）
# 用法：
#   cp .env.example .env   # 改强密码
#   docker compose -f docker-compose.prod.yml up -d
# 访问：http://<VPS-IP>:3000
# ============================================================

services:
  gateway:
    image: allomax-gateway:commercial   # M1/M2 增量构建的镜像
    container_name: allomax-gateway
    restart: always
    command: --log-dir /data/logs
    ports:
      - "3000:3000"
    volumes:
      # 数据盘挂载点按实际调整（大王 20T 数据盘，建议 /data/allomax）
      - ${DATA_DIR:-/data/allomax}/data:/data
      - ${DATA_DIR:-/data/allomax}/logs:/data/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-allomax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-allomax}
      # 日志量大后再启用独立日志库/ClickHouse（20T 数据盘场景推荐 ClickHouse + TTL）
      # - LOG_SQL_DSN=clickhouse://default:${CLICKHOUSE_PASSWORD}@clickhouse:9000/allomax_logs
      # - LOG_SQL_CLICKHOUSE_TTL_DAYS=90
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=allomax-gw-1
      # HTTP/IP 直连模式：SECURE=false（若日后配 HTTPS 域名改 true + TRUSTED_URL）
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_COOKIE_SECURE=false
      # 手机号注册开关（M1 实现后生效）
      - PHONE_REGISTER_ENABLED=true
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - SMS_MOCK_RETURN_CODE=${SMS_MOCK_RETURN_CODE:-true}
      # - SMS_ACCESS_KEY_ID=
      # - SMS_ACCESS_KEY_SECRET=
      # - SMS_SIGN_NAME=
      # - SMS_TEMPLATE_CODE=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [allomax-net]

  redis:
    image: redis:7-alpine
    container_name: allomax-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [allomax-net]

  postgres:
    image: postgres:16-alpine
    container_name: allomax-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allomax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-allomax}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allomax} -d ${POSTGRES_DB:-allomax}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [allomax-net]

  # 可选：日志量大后启用 ClickHouse（官方支持，配上面 LOG_SQL_DSN 注释）
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24.8
  #   container_name: allomax-clickhouse
  #   restart: always
  #   environment:
  #     CLICKHOUSE_DB: allomax_logs
  #     CLICKHOUSE_USER: default
  #     CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  #   volumes:
  #     - ch_data:/var/lib/clickhouse
  #   networks: [allomax-net]

volumes:
  pg_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data/allomax}/postgres
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-/data/allomax}/redis

networks:
  allomax-net:
    driver: bridge
