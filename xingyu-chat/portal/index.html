<style>
:root{
  --primary:#4562f0;
  --primary-bright:#6c86ff;
  --bg:transparent;
  --card:rgba(17,24,54,.55);
  --text:#eef1fa;
  --muted:#9aa3bd;
  --border:rgba(255,255,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:#0e1538;
  color:var(--text);
  display:flex;flex-direction:column;min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
/* 深空星云光晕：紫 + 蓝 两团微光，营造太空氛围 */
body::before{
  content:"";position:fixed;inset:0;
  background:
    radial-gradient(38% 45% at 22% 30%,rgba(109,91,255,.20) 0%,rgba(109,91,255,0) 100%),
    radial-gradient(42% 48% at 78% 20%,rgba(65,118,230,.18) 0%,rgba(65,118,230,0) 100%),
    radial-gradient(30% 40% at 55% 85%,rgba(90,120,255,.12) 0%,rgba(90,120,255,0) 100%);
  pointer-events:none;z-index:0;
}
/* 星空画布：星星闪烁 + 流星划过，置于内容层之下 */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;display:block}
.nav,.hero,.footer,.announcement{position:relative;z-index:1}

/* 无障碍：跳转到主内容（默认视觉隐藏，仅键盘 Tab 聚焦时显现） */
.skip-link{
  position:absolute;left:-9999px;top:0;z-index:99;
  padding:10px 18px;border-radius:0 0 10px 0;
  background:var(--primary);color:#fff;font-size:14px;font-weight:600;
  text-decoration:none;transition:none;
}
.skip-link:focus{left:0;outline:2px solid #fff;outline-offset:-4px}

/* 无 JS 时的降级提示（noscript 内容仅在禁用 JS 时渲染） */
.noscript-tip{
  position:relative;z-index:2;margin:24px auto;max-width:640px;
  padding:16px 20px;border:1px solid var(--border);border-radius:12px;
  background:var(--card);color:var(--text);font-size:14px;line-height:1.7;
}
.noscript-tip a{color:#8fa2ff}
a{text-decoration:none;color:inherit}

/* ===== 顶部导航（极简，DS 无重导航）===== */
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;height:104px;
}
.brand{display:flex;align-items:center;gap:16px}
.brand .logo{
  height:114px;width:auto;flex:none;
  display:block;object-fit:contain;
  transform:translateY(40px);
  filter:drop-shadow(0 0 14px rgba(140,160,255,.5));
}
.brand-name{display:flex;flex-direction:column;line-height:1.25;transform:translateY(40px)}
.brand-name .zh{font-size:20px;font-weight:600;letter-spacing:.02em}
.brand-name .en{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.14em}
.brand-name .en .ai{display:inline-block;font-style:normal;transform:translateX(8px)}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
/* ===== 语言切换器（DS 同款胶囊分段：中文 | EN）===== */
.locale-toggle{display:flex;align-items:center;height:32px;padding:3px;border-radius:999px;border:1px solid rgba(120,140,200,.28)}
.locale-toggle-item{
  display:flex;align-items:center;justify-content:center;height:100%;
  padding:0 12px;border-radius:999px;border:none;background:transparent;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--muted);
  transition:color .2s,background-color .2s,box-shadow .2s;
}
.locale-toggle-item:focus-visible{
  outline:2px solid var(--primary-bright);outline-offset:2px;
}
.locale-toggle-item:hover{color:var(--text)}
.locale-toggle-item.is-active{
  background:rgba(255,255,255,.14);color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.35);
}

/* ===== 公告条（位于 hero 内、标语正上方，胶囊样式·深空玻璃）===== */
.announcement{
  display:flex;align-items:center;gap:8px;align-self:center;
  background:rgba(69,98,240,.14);color:#c3cffd;
  font-size:13px;padding:6px 16px;
  border-radius:999px;border:1px solid rgba(108,134,255,.35);
  margin:0 0 12px; /* 紧贴下方标语 */
  backdrop-filter:blur(6px);
}
/* 关键修复：.announcement 显式设了 display:flex，会覆盖浏览器对 [hidden] 的
   默认 display:none → 属性 hidden 形同虚设，公告条在数据到达前就渲染出一个
   空胶囊（只有「公告」二字、无内容）。此处显式补回，保证 hidden 真正生效。 */
.announcement[hidden]{display:none}
.announcement .tag{
  background:var(--primary);color:#fff;border-radius:4px;
  font-size:11px;padding:2px 8px;font-weight:600;flex:none;
}
.announcement span{cursor:default;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70vw}
.announcement a{color:#8fa2ff;font-weight:600;flex:none}
/* flex 子项中 hidden 也需显式隐藏（flex 布局会忽略部分 non-display 行为） */
.announcement a[hidden]{display:none}
.announcement a:hover{text-decoration:underline}

/* ===== 主区域：整体居中（DS 布局）===== */
.hero{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px 48px;
}
.hero .logo{height:120px;width:auto;display:block;object-fit:contain}
.slogan{
  font-size:clamp(30px,4.5vw,42px);font-weight:700;letter-spacing:.04em;
  text-align:center;
  background:linear-gradient(92deg,#f4f6ff 0%,#c9d4ff 45%,#8fa2ff 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.slogan .sub{
  display:flex;align-items:center;gap:14px;justify-content:center;
  font-size:15px;font-weight:400;color:var(--muted);margin-top:14px;letter-spacing:.08em;
  -webkit-text-fill-color:var(--muted); /* 抵消父级渐变文字裁切 */
}
.slogan .sub i{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.6}

/* ===== 长条输入框（深空玻璃卡：真实输入 + 可切换 pill + 发送）===== */
/* 2026-09-19 对齐 DeepSeek 简约风：
   ① 容器加宽（720 → 880）并给足内边距，输入区自然撑到约三行高度
   ② 去掉 :focus-within 的蓝色描边与光晕 —— DS 聚焦时没有任何高亮框，
      只保留极轻微的阴影加深，避免「点一下冒出个框」的廉价感 */
.chatbox{
  display:block;width:min(880px,94vw);margin-top:48px;
  background:var(--card);border:1px solid var(--border);border-radius:24px;
  box-shadow:0 8px 32px rgba(0,0,10,.45);
  backdrop-filter:blur(14px);
  padding:22px 24px 16px;
}
/* 聚焦时不做任何视觉变化（DS 同款：输入框静态，无描边/无光晕/无阴影加深）
   注：早先保留的「阴影微加深」在实测中表现为 box-shadow 值变化，
   仍属多余动效，已一并去掉；至此聚焦态与静默态像素一致 */
.chatbox textarea{
  display:block;width:100%;border:none;outline:none;resize:none;
  font:inherit;font-size:15px;line-height:1.6;color:var(--text);
  /* 起始高度约三行（3 × 1.6 × 15px ≈ 72px），最高 5 行后滚动 */
  min-height:72px;max-height:132px;overflow-y:auto;
  background:transparent;padding:0 4px;
  /* 去掉部分浏览器在 textarea 聚焦时叠加的默认内阴影/轮廓 */
  -webkit-appearance:none;appearance:none;
}
.chatbox textarea::placeholder{color:var(--muted)}
/* 空输入发送：轻抖提示（prefers-reduced-motion 下自动停用） */
.chatbox textarea.nudge{animation:nudge .3s ease}
@keyframes nudge{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-2px)}
}
.chatbox .tools{
  display:flex;align-items:center;gap:10px;margin-top:16px;
}
.chatbox .pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;color:var(--muted);
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:999px;padding:6px 14px;
  cursor:pointer;user-select:none;
  transition:all .15s ease;
}
.chatbox .pill:hover{border-color:rgba(255,255,255,.35);color:var(--text)}
.chatbox .pill.on{
  background:rgba(69,98,240,.22);border-color:var(--primary-bright);color:#c3cffd;
}
.chatbox .pill svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chatbox .send{
  margin-left:auto;width:36px;height:36px;border-radius:50%;flex:none;
  background:var(--primary);color:#fff;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(69,98,240,.35);
  transition:all .15s ease;
}
.chatbox .send:hover{background:#3b55d9;transform:translateY(-1px)}
.chatbox .send svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chat-go{
  margin-top:14px;font-size:12.5px;color:var(--muted);
  opacity:0;transition:opacity .18s;text-align:center;
}
.chatbox:focus-within + .chat-go{opacity:1}

/* ===== 双入口按钮（DS 同款：实心 + 描边）===== */
.actions{display:flex;gap:16px;margin-top:36px;flex-wrap:wrap;justify-content:center}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  font-size:15px;font-weight:500;border-radius:10px;
  padding:12px 28px;transition:all .18s ease;
}
.btn--chat{
  background:var(--primary);color:#fff;
  box-shadow:0 4px 20px rgba(69,98,240,.45);
}
.btn--chat:hover{background:#3b55d9;transform:translateY(-1px);box-shadow:0 6px 26px rgba(69,98,240,.55)}
.btn--api{
  background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border);
  backdrop-filter:blur(8px);
}
.btn--api:hover{border-color:rgba(255,255,255,.4);box-shadow:0 4px 20px rgba(0,0,10,.4)}
.btn svg{width:16px;height:16px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn--chat svg{stroke:currentColor}
.btn--api svg{stroke:currentColor}

/* ===== 底部（一行，极简）===== */
.footer{
  padding:16px 40px;display:flex;justify-content:center;align-items:center;
  font-size:12.5px;color:var(--muted);gap:18px;flex-wrap:wrap;
}
.footer i{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.5}
.footer a:hover{color:var(--text)}
.footer .service-note{width:100%;text-align:center;font-size:11.5px;opacity:.8;margin-top:2px}

/* ===== 键盘导航：统一焦点环 ===== */
/* 2026-09-19：textarea 从焦点环规则中移除。
   原因：点击输入框同样会命中 :focus-visible，于是「点一下对话框就冒出蓝色高亮
   边框」，这正是大王反馈的观感问题。DeepSeek 首页输入框聚焦时没有任何高亮框。
   移除后键盘 Tab 仍能到达输入框（可聚焦性不变），只是不再画外框——
   输入框本身的玻璃卡边框已足够表明当前焦点位置。 */
a:focus-visible,button:focus-visible,[role="button"]:focus-visible{
  outline:2px solid var(--primary-bright);outline-offset:2px;border-radius:6px;
}
.chatbox textarea:focus,
.chatbox textarea:focus-visible{outline:none;box-shadow:none}

/* ===== 无障碍：晕动症用户关闭星空动画 ===== */
@media (prefers-reduced-motion: reduce){
  #sky{display:none}
  .chatbox textarea.nudge{animation:none}
}

@media (max-width:640px){
  .nav{padding:0 20px;height:88px}
  .brand .logo{height:72px;transform:translateY(28px)}
  .brand-name{transform:translateY(28px)}
  .locale-toggle{height:28px;padding:2px;gap:1px}
  .locale-toggle-item{font-size:11px;padding:3px 8px}
  .actions{gap:10px}
  .btn{padding:11px 20px;font-size:14px}
  .footer{padding:14px 20px}
}
</style>
</head>

<script>
// file:// 本地预览回退地址（唯一 IP 出口，换服务器只改这一行）
var FALLBACK_ORIGIN = 'https://10.255.12.210';
var CHAT_PORT = 8443;   // Chat(OWUI) 独立端口，见下方说明

// Chat 基址推导：**只取 hostname，再硬拼 Chat 端口**。
// ⚠️ 不要用 location.origin.replace(/:(443|80)$/,'') —— 该写法只在 Portal 恰好跑在
// 443/80 时正确；若 Portal 跑在非标准端口（如本地预览 127.0.0.1:8921），
// 替换不命中 → 拼出 "host:8921:8443" 这种非法地址。
function deriveChatOrigin(){
  if (location.protocol !== 'http:' && location.protocol !== 'https:') {
    return FALLBACK_ORIGIN;   // file:// 本地预览
  }
  return location.protocol + '//' + location.hostname + ':' + CHAT_PORT;
}
var CHAT_URL = deriveChatOrigin();
// OWUI 0.11.3 无 BASE_PATH：子路径 /chat/ 与星语绝对路径冲突（实测 /api/config 404），
// Chat 固定走 8443 独立端口；域名到位后改为 https://ai-chat.scpt.edu.cn
// href 仅为「无 JS / 未执行到 apply」时的语义回退，真实跳转由 goChat() 与 apply() 接管
document.getElementById('btn-chat-link').href = CHAT_URL + '/';

// ===== i18n：DS 同款语言切换（中文 | EN），localStorage 记忆 =====
var I18N = {
  zh: {
    notice_tag: '公告', notice_more: '查看详情',
    skip_to_main: '跳到主要内容',
    brand_zh: '川邮·星语',
    slogan: '智汇星语，算启未来',
    sub1: '深度思考', sub2: '多模型', sub3: '联网搜索',
    input_ph: '给星语发送消息，开始对话…', input_aria: '消息输入',
    pill_think: '深度思考', pill_web: '联网搜索',
    send_aria: '发送，进入星语对话',

(function(){
  function apply(lang){
    var dict = I18N[lang] || I18N.zh;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k = el.getAttribute('data-i18n');
      if (dict[k]) el.textContent = dict[k];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
      var k = el.getAttribute('data-i18n-ph');
      if (dict[k]) el.setAttribute('placeholder', dict[k]);
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){
      var k = el.getAttribute('data-i18n-aria');
      if (dict[k]) el.setAttribute('aria-label', dict[k]);
    });
    document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
    // 英文版主行变 StarWhisper，取消 AI 的「星语」对齐偏移
    var aiEl = document.querySelector('.brand-name .en .ai');
    if (aiEl) aiEl.style.transform = (lang === 'en') ? 'translateX(0)' : 'translateX(8px)';
    document.querySelectorAll('.locale-toggle-item').forEach(function(b){
      b.classList.toggle('is-active', b.getAttribute('data-lang') === lang);
    });
    // 川邮·星语（2026-09-19）：把语言带进跳转链接，使星语侧登录页/控制台
    // 按 Portal 当前语言渲染（中→中文登录页，英→英文登录页）。
    // ⚠️ Chat 按钮特殊处理：它指向**跨端口绝对地址**（CHAT_PORT），不能走
    // 「读写 href 再拼会」的通用路径 —— 早期 `href = u.pathname + u.search`
    // 会把 `https://host:8443/` 降级成 `/`，点击变成刷新 Portal = 完全无反应。
    // 这里直接以 CHAT_URL 为基址重建，保证协议/主机/端口三者都不丢。
    document.querySelectorAll('[data-lang-propagate]').forEach(function(a){
      try {
        var raw = a.getAttribute('href') || '/';
        var isChat = a.id === 'btn-chat-link';
        var u = new URL(isChat ? (CHAT_URL + '/') : raw, location.origin);
        u.searchParams.set('lang', lang);
        if (isChat) {
          a.setAttribute('href', u.href);                    // 绝对地址，含 :8443
        } else if (/^[a-z][a-z0-9+.-]*:\/\//i.test(raw)) {
          a.setAttribute('href', u.href);                    // 其他绝对地址保持绝对
        } else {
          a.setAttribute('href', u.pathname + u.search);     // 同源相对地址保持相对
        }
      } catch(e){}
    });
  }
  var saved = null;
  try { saved = localStorage.getItem('xy_lang'); } catch(e){}
  // 川邮·星语（2026-09-19）：URL 的 ?lang= 优先级最高。
  // 场景：用户在星语控制台/登录页切成英文后点「返回主页」，跳回 Portal 会带
  // ?lang=en，Portal 需据此切英文（localStorage 可能因跨设备/清缓存而缺失）。
  // 读到有效值后顺手落盘，使后续直接访问 Portal 也保持该语言。
  var fromUrl = null;
  try { fromUrl = new URLSearchParams(location.search).get('lang'); } catch(e){}
  if (fromUrl === 'en' || fromUrl === 'zh') {
    saved = fromUrl;
    try { localStorage.setItem('xy_lang', saved); } catch(e){}
  }
  // ⚠️ 无论有无记忆语言，都必须跑一次 apply()：
  // 早期写成「仅当 saved 有效才 apply」，导致首次访问（无 xy_lang）时
  // apply 完全不执行 → ① 按钮去不到 ?lang 传播 ② href 不会被归一化。
  // 默认按中文渲染，行为与无 JS 时一致，无副作用。
  apply(saved === 'en' ? 'en' : 'zh');
  document.querySelectorAll('.locale-toggle-item').forEach(function(b){
    b.addEventListener('click', function(){
      var lang = b.getAttribute('data-lang');
      try { localStorage.setItem('xy_lang', lang); } catch(e){}
      apply(lang);
    });
  });
  window.__applyI18n = apply;
})();

// ===== 星空动画：星星闪烁 + 流星划过（canvas，置于内容层下）=====
(function(){
  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var W, H, dpr;
  var stars = [];
  var meteors = [];
  var STAR_DENSITY = 1/4200;   // 每屏星数/像素
  var MAX_METEORS = 3;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 重建星场
    stars = [];
    var n = Math.floor(W * H * STAR_DENSITY);
    for(var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.1 + 0.3,
        p: Math.random() * Math.PI * 2,   // 相位
        s: 0.4 + Math.random() * 1.2,     // 闪烁速度
        a: 0.25 + Math.random() * 0.65    // 基础亮度
      });
    }
  }

  function spawnMeteor(){
    // 从上方随机点出发，向左下方划过（流星经典轨迹）
    meteors.push({
      x: W * (0.25 + Math.random() * 0.75),
      y: -20 - Math.random() * H * 0.15,
      len: 130 + Math.random() * 160,     // 拖尾长
      speed: 5 + Math.random() * 4,
      angle: Math.PI * (0.72 + Math.random() * 0.1), // 约 130°~148°，左下方向
      life: 1                             // 1→0 渐隐
    });
  }

  function tick(ts){
    ctx.clearRect(0, 0, W, H);

    // 星星：正弦闪烁
    for(var i = 0; i < stars.length; i++){
      var st = stars[i];
      var tw = st.a * (0.55 + 0.45 * Math.sin(ts * 0.001 * st.s + st.p));
      ctx.globalAlpha = Math.max(0.05, tw);
      ctx.fillStyle = '#dfe6ff';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 流星：渐隐拖尾（头部亮白，尾部透明蓝）
    for(var j = meteors.length - 1; j >= 0; j--){
      var m = meteors[j];
      var dx = Math.cos(m.angle), dy = Math.sin(m.angle);
      var tailX = m.x - dx * m.len, tailY = m.y - dy * m.len;
      var grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
      grad.addColorStop(0, 'rgba(255,255,255,' + (0.9 * m.life) + ')');
      grad.addColorStop(0.25, 'rgba(190,205,255,' + (0.55 * m.life) + ')');
      grad.addColorStop(1, 'rgba(120,140,255,0)');
      ctx.globalAlpha = 1;
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();
      // 头部亮点
      ctx.globalAlpha = 0.9 * m.life;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
      ctx.fill();

      // 前进 + 生命衰减
      m.x += dx * m.speed; m.y += dy * m.speed;
      m.life -= 0.008;
      if(m.life <= 0 || m.y > H + 60 || m.x < -m.len){
        meteors.splice(j, 1);
      }
    }

    // 随机生成新流星（平均 1.2~2.5s 一颗，最多同时 3 颗）
    if(meteors.length < MAX_METEORS && Math.random() < 0.012){
      spawnMeteor();
    }

    ctx.globalAlpha = 1;
    // 自续帧需受 running 门控：否则 stop() 取消的只是「当前这一帧」，
    // tick 内部会立刻再排一帧，后台暂停形同虚设（实测 pausedStable=false）
    if (running) rafId = requestAnimationFrame(tick);
  }

  window.addEventListener('resize', (function(){
    var t;
    return function(){
      clearTimeout(t);
      t = setTimeout(resize, 150);   // 防抖：拖拽窗口时不连续重建星场
    };
  })());
  resize();
  // 晕动症用户（系统开启「减弱动态效果」）：不跑动画，只铺一层静态星
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  // 标签页不可见时暂停渲染循环：省 CPU/电量。
  // rAF 在后台本就节流，但显式 stop 才能彻底断掉；回前台靠 visibilitychange 续跑。
  var rafId = 0, running = false, started = false;
  function start(){
    if (running || reduced.matches) return;
    running = true;
    rafId = requestAnimationFrame(tick);
  }
  function stop(){
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  }
  document.addEventListener('visibilitychange', function(){
    // 只在「曾经启动过」时才续跑，避免 reduced-motion 用户被意外唤起动画
    if (document.hidden) { stop(); } else if (started) { start(); }
  });
  if (reduced.matches){
    tickStatic();
  } else {
    started = true;
    start();
  }
  function tickStatic(){
    ctx.clearRect(0, 0, W, H);
    for(var i = 0; i < stars.length; i++){
      var st = stars[i];
      ctx.globalAlpha = st.a;
      ctx.fillStyle = '#dfe6ff';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
})();

// ===== 输入框：自动增高（1~5 行） =====
var msg = document.getElementById('msg');
function autoGrow(){
  msg.style.height = 'auto';
  // 下限 72px ≈ 三行（与 CSS 的 min-height 保持一致），
  // 避免首次输入时被压回单行造成高度跳变
  msg.style.height = Math.min(Math.max(msg.scrollHeight, 72), 132) + 'px';
}
msg.addEventListener('input', autoGrow);

// ===== pill：点击切换选中/取消（DS 同款交互） =====
function bindPill(id){
  var el = document.getElementById(id);
  function toggle(e){
    e.stopPropagation();
    var on = el.classList.toggle('on');
    el.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  el.addEventListener('click', toggle);
  el.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(e); }
  });
}
bindPill('pill-think');
bindPill('pill-web');

// ===== 发送：回车（Shift+Enter 换行）或点箭头 → 跳转星语对话 =====
// 消息与 pill 状态编码进 URL（xy_ 前缀，避免撞 OWUI 原生参数如 ?q=全局搜索）。
// 当前 OWUI 0.11.3 会忽略未知参数（落到新会话页）；阶段 2 fork 时加几行读取逻辑即可自动带入。
function goChat(){
  var text = msg.value.trim();
  if(!text){
    // 空输入：不跳转，聚焦输入框并轻微提示（兼容中英文）
    msg.focus();
    msg.classList.remove('nudge');
    void msg.offsetWidth;            // 强制 reflow，重置动画
    msg.classList.add('nudge');
    return;
  }
  var think = document.getElementById('pill-think').classList.contains('on');
  var web = document.getElementById('pill-web').classList.contains('on');
  var url = CHAT_URL + '/?xy_msg=' + encodeURIComponent(text);
  if(think) url += '&xy_think=1';
  if(web) url += '&xy_web=1';
  // 带上当前语言，使 Chat 首屏按 Portal 语言渲染（与按钮跳转行为一致）
  try {
    var lg = localStorage.getItem('xy_lang');
    if (lg === 'en' || lg === 'zh') url += '&lang=' + lg;
  } catch(e){}
  window.location.href = url;
}
msg.addEventListener('keydown', function(e){
  // isComposing：中文输入法选词的回车不是「发送」，否则拼音候选期敲回车会直接跳页
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    goChat();
  }
});
document.getElementById('send').addEventListener('click', function(e){
  e.stopPropagation();
  goChat();
});

// ===== 本地 file:// 预览回退：相对路径仅在 http(s) 下有效，file:// 下回退直连 =====
(function(){
  if (location.protocol === 'http:' || location.protocol === 'https:') return;
  // file:// 本地预览：相对路径无处可去，回退直连地址（统一走 FALLBACK_ORIGIN，改 IP 只动一处）
  var chatBtn = document.getElementById('btn-chat-link');
  if (chatBtn) chatBtn.href = FALLBACK_ORIGIN + ':8443';
  var apiBtn = document.querySelector('.btn--api');
  if (apiBtn) apiBtn.href = FALLBACK_ORIGIN + '/console';
})();
// ===== 公告条：读星语 /api/notice（同域反代，无 CORS）。返回空/失败则整条隐藏 =====
(function(){
  fetch('/api/notice').then(function(r){return r.ok?r.json():null}).then(function(d){
    var data = d && (d.data !== undefined ? d.data : d);
    var text = data && typeof data === 'object' ? (data.content || data.notice || '') : (data || '');
    if(text){
      document.getElementById('announcement-text').textContent = String(text).replace(/<[^>]+>/g,'');
      document.getElementById('announcement').hidden = false;
      // 「查看详情」链接：只有公告确实带 url 时才显示。
      // 之前 href 写死 /console 且永远 hidden —— 属于死链（点了没反应/语义不符）。
      // 现在取 link/url 字段；仅允许站内相对路径与 https，杜绝 javascript: 注入。
      var el = document.getElementById('announcement-link');
      var link = data && typeof data === 'object' ? (data.link || data.url || '') : '';
      if (link && (/^\/[^/\\]/.test(link) || /^https:\/\//.test(link))) {
        el.href = link;
        el.hidden = false;
      } else {
        el.hidden = true;
        el.removeAttribute('href');   // 去掉写死的 /console，避免无链接时仍是可点死链
      }
    } else {
      console.warn('[星语] /api/notice 无公告内容（接口正常但为空）');
    }
  }).catch(function(){ console.warn('[星语] /api/notice 不可达，公告条隐藏（nginx 反代未就绪或星语未启动）'); });
})();
