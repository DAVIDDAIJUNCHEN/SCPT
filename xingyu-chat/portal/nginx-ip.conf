# IP 先行版 nginx 配置（10.255.12.210）
# 三入口：/ 根 = Portal 静态页；其余 = 星语；:8443 = OWUI Chat
# 域名（ai/ai-chat/ai-platform.scpt.edu.cn）到位后按文末"域名切换"节改造

# ---------- 1. 主入口 443：Portal + 星语 ----------
server {
    listen 443 ssl;
    server_name 10.255.12.210;   # 自签证书需含 IP SAN，见文末证书节

    # 证书：先沿用现有自签（需重签加 IP SAN），域名到位后换正式证书
    ssl_certificate     /data/nginx/cert/xy.crt;
    ssl_certificate_key /data/nginx/cert/xy.key;

    # --- Portal：根路径 + 静态资源（logo/favicon 等）---
    location = / {
        root /data/xingyu-chat/portal;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /assets/ {
        root /data/xingyu-chat/portal;
        expires 7d;
    }

    # --- 其余全部反代星语（/console /login /api /v1 /dashboard ...）---
    # 注意：/chat/ 已在上文优先匹配，不会被此块吞掉
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # 星语前端可能用 WS
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;                     # 兼容流式响应
        proxy_buffering off;
    }

    # --- Chat：同域 /chat/ 反代 OWUI（Portal 相对路径入口）---
    # OWUI 0.11.3 无 BASE_PATH 支持，反代需重写 cookie/session 的路径域：
    # 若 OWUI 内部绝对路径（/api/v1s/...）被浏览器请求回 /api/... 会撞星语路由，
    # 则保留 8443 独立端口方案，Portal 回退用 CHAT_URL 常量直连。
    location /chat/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 100m;
    }
}

# ---------- 2. Chat 入口 8443：OWUI ----------
server {
    listen 8443 ssl;
    server_name 10.255.12.210;

    ssl_certificate     /data/nginx/cert/xy.crt;
    ssl_certificate_key /data/nginx/cert/xy.key;

    # OWUI 不支持子路径（无 BASE_PATH），独占一个端口（IP 阶段无子域名可用）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # OWUI WS（实时对话）
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;                    # 长对话/流式
        proxy_buffering off;                         # 流式必须关
        client_max_body_size 100m;                   # 文件上传/知识库
    }
}

# ---------- 3. 80 端口：统一跳 443 ----------
server {
    listen 80;
    server_name 10.255.12.210 _;
    return 301 https://$host$request_uri;
}

# ========== 证书节：自签 + IP SAN ==========
# 现有自签证书 CN=10.255.12.103（为旧网关签的），Portal/Chat 阶段需重签含 IP SAN：
#   cd /data/nginx/cert
#   openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
#     -keyout xy.key -out xy.crt \
#     -subj "/CN=10.255.12.210" \
#     -addext "subjectAltName=IP:10.255.12.210,DNS:ai.scpt.edu.cn,DNS:ai-chat.scpt.edu.cn,DNS:ai-platform.scpt.edu.cn"
# 顺手把未来三个子域写进 SAN，域名到位后证书不用再换一次。
# 浏览器侧仍需手动信任一次（校内可发根证书安装指引，属沟通成本非技术成本）。

# ========== 域名切换节（DNS+证书到位后）==========
# 1) server_name 分别改为 ai / ai-chat / ai-platform.scpt.edu.cn
# 2) Portal 的 chat 入口改 https://ai-chat.scpt.edu.cn（portal/index.html 的 CHAT_URL 回退常量 1 处）
# 3) OWUI base_url 切 https://ai-platform.scpt.edu.cn/v1，去掉 AIOHTTP_CLIENT_SESSION_SSL=false
# 4) 星语 options 表 ServerAddress 改 https://ai-platform.scpt.edu.cn
# 5) 保留 IP 入口作兜底（default_server 指到 443 主块）
